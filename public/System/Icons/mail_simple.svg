<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple Mail Icon in Windows XP Style -->
  <!-- Background with XP-style gradient -->
  <rect x="0" y="0" width="32" height="32" fill="#ECE9D8"/>
  
  <!-- Mail envelope -->
  <rect x="4" y="10" width="24" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  
  <!-- Mail flap -->
  <path d="M4 10 L16 18 L28 10" stroke="#000000" stroke-width="1" fill="none"/>
  
  <!-- Inner shading -->
  <rect x="5" y="11" width="22" height="14" fill="#F8F8F8"/>
  
  <!-- Mail lines for classic look -->
  <line x1="7" y1="14" x2="25" y2="14" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="7" y1="17" x2="25" y2="17" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="7" y1="20" x2="20" y2="20" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- 3D effect borders -->
  <line x1="4" y1="10" x2="4" y2="26" stroke="#808080" stroke-width="1"/>
  <line x1="4" y1="26" x2="28" y2="26" stroke="#808080" stroke-width="1"/>
  <line x1="28" y1="26" x2="28" y2="10" stroke="#808080" stroke-width="1"/>
  
  <!-- Highlight -->
  <line x1="5" y1="11" x2="27" y2="11" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="5" y1="11" x2="5" y2="25" stroke="#FFFFFF" stroke-width="1"/>
</svg>